# =============================================================================
# Docker build & push -> Docker Hub (submit2mxh/lmu-router-docs)
# -----------------------------------------------------------------------------
# 触发：给「指定分支」上的提交打任意 tag 后推送 tag 即触发；镜像 tag = 完整 tag 名。
#   - git tag 本身不属于任何分支，只指向某个 commit；
#   - 因此先用 guard job 校验该 tag 指向的 commit 是否在 TARGET_BRANCH 上，
#     不在则跳过构建（避免在别的分支打 tag 也误触发发布）。
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   DOCKERHUB_USERNAME  能向 submit2mxh 命名空间推送的 Docker Hub 账号
#   DOCKERHUB_TOKEN     该账号的 Access Token（Read/Write）
# =============================================================================
name: Docker Build & Push

on:
  push:
    tags:
      - '*'             # 任意 tag 都触发
  workflow_dispatch:    # 也允许在 Actions 页面手动触发
    inputs:
      ref:
        description: '要构建的 tag 或分支（手动触发时使用）'
        required: true
        type: string

env:
  IMAGE: submit2mxh/lmu-router-docs   # 目标镜像：https://hub.docker.com/r/submit2mxh/lmu-router-docs
  TARGET_BRANCH: main                 # 「指定分支」：只有该分支上的 commit 打 tag 才会发布
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: write   # 需要 write 才能自动创建 GitHub Release

jobs:
  # ---------------------------------------------------------------------------
  # 1) 校验 tag 指向的 commit 是否在指定分支上
  # ---------------------------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Verify commit is on ${{ env.TARGET_BRANCH }}
        id: check
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}" --depth=0 || git fetch origin "${TARGET_BRANCH}"
          SHA="$(git rev-parse HEAD)"
          echo "Tagged commit: ${SHA}"

          if git merge-base --is-ancestor "${SHA}" "origin/${TARGET_BRANCH}"; then
            echo "commit 在 ${TARGET_BRANCH} 上，继续构建"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "commit 不在 ${TARGET_BRANCH} 上，跳过发布"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 2) 构建并推送镜像（站点变体矩阵）
  #    com → docs.lmuai.com：tag 名与历史完全一致（latest / vX.Y.Z），北京机在用
  #    ai  → docs.lmuai.ai ：tag 加 -ai 后缀（latest-ai / vX.Y.Z-ai），新加坡机在用
  #    fail-fast: false —— arm64 QEMU 偶发 SIGILL（见 deploy skill 坑 5），一条腿
  #    抖动不应拖死另一条；单腿重跑用 workflow_dispatch 即可（矩阵会两腿都跑，
  #    已成功的那腿仅是重复推同内容，无害）。
  # ---------------------------------------------------------------------------
  build-and-push:
    needs: guard
    if: ${{ needs.guard.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: com
            suffix: ''
          - variant: ai
            suffix: '-ai'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}
          # 默认 true 会把 GITHUB_TOKEN 以 http.extraheader 写进 .git/config。
          # 本 job 之后只做 docker build，不再需要 git 凭据；而 cache-to 用了
          # mode=max（导出所有中间层到公开可读的 :buildcache），一旦 .git 因任何
          # 原因进了构建上下文，凭据就会随缓存发到公网。这里从源头不写入。
          persist-credentials: false

      # content-dates.json 记录每篇 MDX 的 git 最后提交时间，供 sitemap 的 lastmod、
      # TechArticle 的 dateModified 和页面底部的「最后更新」使用。
      #
      # 它必须在**这里**生成，不能只依赖仓库里已提交的那份：
      #   - .dockerignore 屏蔽了 .git（CI 的 cache mode=max 会把含 GITHUB_TOKEN 的
      #     构建层发到公开 registry，见该文件注释），所以镜像内的 build 步骤没有 git，
      #     scripts/build-content-dates.mjs 会走「无 git → 沿用已提交的 JSON」分支；
      #   - 而那份 JSON 只有恰好本地跑过 npm run build 并顺手提交才会更新。实测它
      #     停在 2026-07-27，比真实内容落后一个月——sitemap 正告诉 Google「8 月改过
      #     的页面最后修改于 7 月」。
      # 这一步在 checkout 之后、docker build 之前跑，此时 .git 完整（fetch-depth: 0），
      # 生成的 JSON 随构建上下文进镜像。.git 本身仍不进上下文，安全措施不变。
      - name: Refresh content-dates.json from git history
        run: |
          node scripts/build-content-dates.mjs
          echo "--- 前 5 条 ---"
          head -6 content-dates.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # 直接用完整 git tag 名作镜像 tag，不做任何截取（保留 v / 前缀等）。
            # 例：v0.1.0 -> v0.1.0；release-2026-07 -> release-2026-07。
            type=ref,event=tag
            type=raw,value=latest
          # latest 由上面的 raw 规则显式控制，禁用自动 latest。
          # flavor.suffix 给两类 tag 统一追加变体后缀：com 腿为空（latest / vX.Y.Z
          # 逐字不变），ai 腿为 -ai（latest-ai / vX.Y.Z-ai）。
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # 站点变体（见 lib/variant.ts / Dockerfile ARG）。com 腿传 com = 现状不变。
          build-args: |
            SITE_VARIANT=${{ matrix.variant }}
          # Registry 缓存：存到 Docker Hub 同仓库的 buildcache tag，跨 run 稳定复用。
          # 变体各自一个 cache tag（buildcache / buildcache-ai），互不覆盖 ——
          # 两个变体的 build 产物层完全不同，共用一个 tag 会互相清洗。
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache${{ matrix.suffix }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache${{ matrix.suffix }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Summary
        run: |
          {
            echo "### Pushed to Docker Hub"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------------------------
      # 3) 自动创建 GitHub Release
      #   条件只看 github.ref 是不是 tag——两种入口都覆盖：
      #   - push tag：github.ref = refs/tags/vX，恒真
      #   - workflow_dispatch --ref vX（含 rebuild-on-merge.yml 的自动补构建）：
      #     workflow 从该 tag ref 运行，github.ref 同样是 refs/tags/vX
      #   若 dispatch 时 ref 传的是 branch（如 main），会跳过，不会误创。
      #   矩阵下只在 com 腿创建（softprops 重复创建会失败/污染，一个 tag 一个 Release）。
      # -------------------------------------------------------------------------
      - name: Create GitHub Release
        if: ${{ matrix.variant == 'com' && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## 🐳 Docker 镜像

            多架构镜像已推送到 Docker Hub（`linux/amd64` + `linux/arm64`）：

            ```bash
            # 拉取本版本
            docker pull ${{ env.IMAGE }}:${{ github.ref_name }}

            # 或拉取 latest（始终指向最新构建）
            docker pull ${{ env.IMAGE }}:latest
            ```

            **构建信息**
            - **镜像**：[`${{ env.IMAGE }}:${{ github.ref_name }}`](https://hub.docker.com/r/${{ env.IMAGE }}/tags?name=${{ github.ref_name }})
            - **Commit**：`${{ github.sha }}`
            - **架构**：linux/amd64, linux/arm64
          generate_release_notes: true   # 自动附上距上个 tag 以来的 commit 列表
          draft: false
          prerelease: false
