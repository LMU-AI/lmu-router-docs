# docs.lmuai.ai（海外站变体）—— 部署在海外机 work@8.222.155.17:/home/work/docs
# 与北京机的 routerDocs（docs.lmuai.com，:latest，host 3004）完全独立。
#
# 镜像 tag 用 :latest-ai（docker-build.yml 矩阵的 ai 腿产物）。与 .com 同理，
# 不要固化成具体版本号 —— rebuild-on-merge 更新 :latest-ai 后 pull 即生效；
# 需要回滚时再临时 docker tag 旧版本覆盖（见 deploy-docs skill 的回滚节）。
#
# 反代（同机 Caddy /etc/caddy/Caddyfile）加一个 vhost：
#   docs.lmuai.ai {
#       encode zstd gzip
#       header Strict-Transport-Security "max-age=31536000"
#       reverse_proxy localhost:3005
#   }
services:
  limao-docs-ai:
    image: submit2mxh/lmu-router-docs:latest-ai
    container_name: limao-docs-ai
    restart: unless-stopped
    ports:
      - '127.0.0.1:3005:3000'
